[profile.default]

solc = "0.8.25"
auto_detect_solc = false

# optimizer settings for snapshotting.
optimizer = true
optimizer_runs = 1000000
evm_version = "cancun"

bytecode_hash = "none"
cbor_metadata = false

# `script/CopyArtifacts.sol` and its freshness test shell out to `jq` via
# `vm.ffi` to extract the deterministic subset of the forge artifact, and
# `test/subgraph/SubgraphManifest.t.sol` shells out to `jq` for that artifact's
# event signatures and to `yq` to read `subgraph/subgraph.yaml` as parsed YAML
# rather than as text. Both are on `PATH` in the rainix sol shell.
ffi = true

libs = ["dependencies"]

# The filesystem access in this repo. `script/CopyArtifacts.sol` reads forge
# build output and writes the stable subset for the rust bindings to consume;
# `test/script/CopyArtifacts.t.sol` reads both back to assert the committed copy
# is fresh. `test/subgraph/SubgraphManifest.t.sol` needs no entry: it reads the
# manifest through `yq` over `vm.ffi`, which this list does not gate.
fs_permissions = [
  { access = "read", path = "out/" },
  { access = "read-write", path = "crates/bindings/abi/" },
]

[fuzz]
runs = 5096

# Library repo: the `IMetaBoardV1_2`/`IMetaV1_2`/`IDescribedByMetaV1` interface
# surface plus the `Lib*` logic that implements it. The concrete `MetaBoard`,
# its deploy-pin snapshots and the deploy scripts live in rain.metadata.deploy
# (rainlanguage/rain.metadata#134). The published `src/` imports nothing
# external, so every dependency here is test-harness only.
[dependencies]
forge-std = "1.16.2"

[soldeer]
recursive_deps = false
