specVersion: 0.0.4
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum/contract
    name: metaboard0
    network: template
    source:
      abi: MetaBoard
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - MetaBoard
        - MetaV1
      abis:
        - name: MetaBoard
          file: ../out/IMetaBoardV1_2.sol/IMetaBoardV1_2.json
      eventHandlers:
        - event: MetaV1_2(address,bytes32,bytes)
          handler: handleMetaV1_2
      file: ./src/metaBoard.ts
